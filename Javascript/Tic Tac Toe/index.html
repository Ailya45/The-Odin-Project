<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe - The Odin Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>Tres en Raya</h1>

      <div class="player-setup">
        <div class="input-group">
          <input
            type="text"
            id="player1-input"
            placeholder="Jugador X"
            value="Player 1"
          />
          <input
            type="text"
            id="player2-input"
            placeholder="Jugador O"
            value="Player 2"
          />
        </div>
        <button id="start-btn" class="btn btn-secondary">
          Comenzar / Actualizar Nombres
        </button>
      </div>

      <!-- Sección para configurar jugadores / Mensajes de turno -->
      <div class="game-info">
        <p id="turn-message" class="turn-message">
          ¡Comienza el juego! Turno de X
        </p>
      </div>

      <!-- Tablero de juego 3x3 -->
      <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>

      <!-- Controles de partida -->
      <div class="game-controls">
        <button id="restart-btn" class="btn">Reiniciar Partida</button>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
