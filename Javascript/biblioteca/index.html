<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Biblioteca - The Odin Project</title>
    <link rel="stylesheet" href="/biblioteca/style/style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1>📚 Mi Biblioteca</h1>
      <button id="new-book-btn" class="btn btn-primary">+ Añadir Libro</button>
    </header>

    <main class="container">
      <div id="library-container" class="library-grid">
        <!-- Aquí se insertarán las tarjetas de los libros desde JavaScript -->
      </div>
    </main>

    <!-- Modal / Formulario flotante -->
    <dialog id="book-modal" class="modal">
      <div class="modal-content">
        <h2>Nuevo Libro</h2>
        <form id="book-form">
          <div class="form-group">
            <label for="title">Título:</label>
            <input
              type="text"
              id="title"
              required
              placeholder="Ej: Cien años de soledad"
            />
          </div>

          <div class="form-group">
            <label for="author">Autor:</label>
            <input
              type="text"
              id="author"
              required
              placeholder="Ej: Gabriel García Márquez"
            />
          </div>

          <div class="form-group">
            <label for="pages">Páginas:</label>
            <input
              type="number"
              id="pages"
              required
              min="1"
              placeholder="Ej: 417"
            />
          </div>

          <div class="form-group checkbox-group">
            <label for="read">¿Leído?:</label>
            <input type="checkbox" id="read" />
          </div>

          <div class="modal-actions">
            <button
              type="button"
              id="close-modal-btn"
              class="btn btn-secondary"
            >
              Cancelar
            </button>
            <button id="submit-book-btn" type="submit" class="btn btn-primary">
              Guardar Libro
            </button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
